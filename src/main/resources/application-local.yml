# Zero-infrastructure profile: file-backed H2 instead of Postgres, so the monitor can be run and
# inspected with nothing installed. The price history persists in ./data/flightmonitor.mv.db and
# survives restarts, which is enough for trying the system out.
#
#   SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
#
# Use the default (Postgres) profile for anything you intend to leave running.
spring:
  datasource:
    url: jdbc:h2:file:./data/flightmonitor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
